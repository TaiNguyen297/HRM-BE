services:
  postgres:
    image: postgres:16-alpine
    container_name: hrm_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hrm_db
      POSTGRES_USER: hrm_admin
      POSTGRES_PASSWORD: Admin@123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
